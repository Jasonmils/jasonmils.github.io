<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 494" role="img" aria-labelledby="title"><title id="title">Dense Skip Attention electricity-price forecasting framework</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#617398"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263149}.label{font-size:18px;font-weight:600}.note{font-size:14px;fill:#62718d}.arrow{fill:none;stroke:#617398;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f7fd;stroke:#d8e0f1;stroke-width:1.4}.shared{fill:#eaf0ff;stroke:#bacaf4;stroke-width:1.4}.local{fill:#f2eefb;stroke:#d7cbee;stroke-width:1.4}</style><rect width="720" height="494" fill="white"/><rect class="box" x="130" y="18" width="460" height="58" rx="15"/><text class="label" x="360" y="53" text-anchor="middle">Hourly features → Min-Max scaling</text><rect class="shared" x="130" y="108" width="460" height="68" rx="15"/><text class="label" x="360" y="134" text-anchor="middle">ARUCNN × 4</text><text class="note" x="360" y="157" text-anchor="middle">Unshared convolution · Residual mapping · PReLU</text><rect class="shared" x="130" y="208" width="460" height="68" rx="15"/><text class="label" x="360" y="234" text-anchor="middle">Dropout 0.5 → GRU × 5</text><text class="note" x="360" y="257" text-anchor="middle">Short-term + Long-term dependencies</text><rect class="box" x="130" y="308" width="460" height="58" rx="15"/><text class="label" x="360" y="343" text-anchor="middle">Dense Skip Attention</text><path class="arrow" d="M360 76V108"/><path class="arrow" d="M360 176V208"/><path class="arrow" d="M360 276V308"/><path class="arrow" d="M360 366V388H180V406"/><path class="arrow" d="M360 388H540V406"/><rect class="box" x="20" y="406" width="320" height="68" rx="15"/><text class="label" x="180" y="432" text-anchor="middle">Point forecast</text><text class="note" x="180" y="455" text-anchor="middle">MAE loss</text><rect class="local" x="380" y="406" width="320" height="68" rx="15"/><text class="label" x="540" y="432" text-anchor="middle">Interval forecast</text><text class="note" x="540" y="455" text-anchor="middle">Smooth quantile loss · α = 0.05 / 0.95</text></svg>