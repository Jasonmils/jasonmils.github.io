<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="title"><title id="title">SiDGI: graph generation and edge calibration</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#617398"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#263149}.label{font-size:18px;font-weight:600}.note{font-size:14px;fill:#62718d}.arrow{fill:none;stroke:#617398;stroke-width:2;marker-end:url(#arrow)}.box{fill:#f5f7fd;stroke:#d8e0f1;stroke-width:1.4}.shared{fill:#eaf0ff;stroke:#bacaf4;stroke-width:1.4}.local{fill:#f2eefb;stroke:#d7cbee;stroke-width:1.4}</style><rect width="720" height="372" fill="white"/><rect class="box" x="20" y="28" width="300" height="68" rx="15"/><text class="label" x="170" y="54" text-anchor="middle">Two feature embeddings</text><text class="note" x="170" y="77" text-anchor="middle">Learnable node representations</text><rect class="shared" x="400" y="28" width="300" height="68" rx="15"/><text class="label" x="550" y="54" text-anchor="middle">Directed adjacency</text><text class="note" x="550" y="77" text-anchor="middle">PReLU(M₁M₂ᵀ − M₂M₁ᵀ)</text><rect class="shared" x="400" y="137" width="300" height="68" rx="15"/><text class="label" x="550" y="163" text-anchor="middle">Top-k edge selection</text><text class="note" x="550" y="186" text-anchor="middle">Sparse learned graph</text><rect class="box" x="20" y="137" width="300" height="68" rx="15"/><text class="label" x="170" y="163" text-anchor="middle">Local feature sequences</text><text class="note" x="170" y="186" text-anchor="middle">Each node is a feature, not a farm</text><rect class="shared" x="400" y="248" width="300" height="68" rx="15"/><text class="label" x="550" y="274" text-anchor="middle">Multi-head graph attention</text><text class="note" x="550" y="297" text-anchor="middle">Calibrate edge weights</text><rect class="box" x="20" y="248" width="300" height="68" rx="15"/><text class="label" x="170" y="274" text-anchor="middle">Normalize + Conv1D</text><text class="note" x="170" y="297" text-anchor="middle">SiDGI output representation</text><path class="arrow" d="M320 62H400"/><path class="arrow" d="M550 96V137"/><path class="arrow" d="M550 205V248"/><path class="arrow" d="M320 171H355V282H400"/><path class="arrow" d="M400 282H320"/><text class="note" x="360" y="351" text-anchor="middle">Add positional / temporal embeddings → Local Encoder–Decoder</text></svg>