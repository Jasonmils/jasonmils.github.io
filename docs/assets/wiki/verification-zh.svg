<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">页面审批与写后验证</title><desc id="desc">具名草稿、批准范围、并发保护和独立回执</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8498bf"/></marker></defs><rect width="960" height="460" rx="24" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="38" font-size="20" fill="#1e293b" font-weight="600">写入范围与完成条件都可以核对</text><g data-node="1 · 草稿与基线"><rect x="30" y="118" width="195" height="150" rx="16" fill="#f7f8fa" stroke="#e2e6ef"/><text x="48" y="147" font-size="13" fill="#475569" font-weight="600">1 · 草稿与基线</text><text x="48" y="172" font-size="13" fill="#52617b" font-weight="400">页面与依赖映射</text><text x="48" y="192" font-size="13" fill="#52617b" font-weight="400">来源 / 草稿 /</text><text x="48" y="212" font-size="13" fill="#52617b" font-weight="400">当前版本哈希</text></g><g data-node="2 · 具名页面批准"><rect x="265" y="118" width="195" height="150" rx="16" fill="#fff8e9" stroke="#eeddb5"/><text x="283" y="147" font-size="13" fill="#94631d" font-weight="600">2 · 具名页面批准</text><text x="283" y="172" font-size="13" fill="#52617b" font-weight="400">批准精确页面 ID 与基线</text><text x="283" y="192" font-size="13" fill="#52617b" font-weight="400">范围变化时重新预览</text></g><g data-node="3 · 受保护的写入"><rect x="500" y="118" width="195" height="150" rx="16" fill="#f0f4ff" stroke="#d5dff8"/><text x="518" y="147" font-size="13" fill="#1b45dc" font-weight="600">3 · 受保护的写入</text><text x="518" y="172" font-size="13" fill="#52617b" font-weight="400">共享锁 + expected-old</text><text x="518" y="192" font-size="13" fill="#52617b" font-weight="400">hash</text><text x="518" y="212" font-size="13" fill="#52617b" font-weight="400">原子页面写入 · 索引 ·</text><text x="518" y="232" font-size="13" fill="#52617b" font-weight="400">追加日志</text></g><g data-node="4 · 独立验收"><rect x="735" y="118" width="195" height="150" rx="16" fill="#edf8f5" stroke="#cfe9df"/><text x="753" y="147" font-size="13" fill="#17765d" font-weight="600">4 · 独立验收</text><text x="753" y="172" font-size="13" fill="#52617b" font-weight="400">核对最终文件与获批草稿</text><text x="753" y="192" font-size="13" fill="#52617b" font-weight="400">生成写后验证回执</text></g><path d="M225 192H262" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M460 192H497" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M695 192H732" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="验收同时检查"><rect x="30" y="320" width="900" height="103" rx="16" fill="#f7f8fa" stroke="#e2e6ef"/><text x="48" y="349" font-size="15" fill="#475569" font-weight="600">验收同时检查</text><text x="48" y="374" font-size="13" fill="#52617b" font-weight="400">来源不变 · 获批范围一致 · 索引唯一登记 · 日志历史只追加 · 无额外页面改动</text><text x="48" y="394" font-size="13" fill="#52617b" font-weight="400">冲突或中途失败保留实际进度；证据的 partial 状态继续保留</text></g></g></svg>