<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc"><title id="title">Video evidence pipeline</title><desc id="desc">Audio and visual processing remain separate; text refinement and local visual review feed coverage checks</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8498bf"/></marker></defs><rect width="960" height="720" rx="24" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="38" font-size="20" fill="#1e293b" font-weight="600">Video → timeline and locator-bound evidence</text><g data-node="MP4 preflight and preservation"><rect x="30" y="62" width="900" height="82" rx="16" fill="#f7f8fa" stroke="#e2e6ef"/><text x="48" y="91" font-size="15" fill="#475569" font-weight="600">MP4 preflight and preservation</text><text x="48" y="116" font-size="13" fill="#52617b" font-weight="400">Source hash / media metadata / dependencies / configuration / stable source and job identity</text></g><path d="M480 144V159H250V177" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M480 159H710V177" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="Audio: transcription and local alignment"><rect x="30" y="180" width="440" height="190" rx="16" fill="#f0f4ff" stroke="#d5dff8"/><text x="48" y="209" font-size="15" fill="#1b45dc" font-weight="600">Audio: transcription and local alignment</text><text x="48" y="234" font-size="13" fill="#52617b" font-weight="400">Authorized Gemini audio chunks, or local Qwen3-ASR</text><text x="48" y="254" font-size="13" fill="#52617b" font-weight="400">WhisperX word timestamps; local speaker processing</text><text x="48" y="274" font-size="13" fill="#52617b" font-weight="400">Fallback for ordinary failures; unresolved remote</text><text x="48" y="294" font-size="13" fill="#52617b" font-weight="400">cleanup stops the route</text><text x="48" y="314" font-size="13" fill="#52617b" font-weight="400">Record actual providers, alignment model and failure</text><text x="48" y="334" font-size="13" fill="#52617b" font-weight="400">codes</text></g><g data-node="Visual: slides and chart/table evidence"><rect x="490" y="180" width="440" height="190" rx="16" fill="#f4f0fd" stroke="#e1d8f7"/><text x="508" y="209" font-size="15" fill="#7050b1" font-weight="600">Visual: slides and chart/table evidence</text><text x="508" y="234" font-size="13" fill="#52617b" font-weight="400">Keyframes and slide identity / duplicates / revisits</text><text x="508" y="254" font-size="13" fill="#52617b" font-weight="400">General OCR for every primary keyframe</text><text x="508" y="274" font-size="13" fill="#52617b" font-weight="400">Structure OCR per canonical-page representative</text><text x="508" y="294" font-size="13" fill="#52617b" font-weight="400">Chart / formula risk → required screenshot-review queue</text></g><path d="M250 370V437" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M710 370V400H250V437" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="394" y="394" font-size="12" fill="#52617b" font-weight="400">Transcript / OCR text only</text><path d="M710 370V437" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="Text refinement · separately authorized"><rect x="30" y="440" width="440" height="108" rx="16" fill="#f0f4ff" stroke="#d5dff8"/><text x="48" y="469" font-size="15" fill="#1b45dc" font-weight="600">Text refinement · separately authorized</text><text x="48" y="494" font-size="13" fill="#52617b" font-weight="400">DeepSeek receives transcript and related slide OCR text</text><text x="48" y="514" font-size="13" fill="#52617b" font-weight="400">Preserve original ASR/OCR and time locators</text></g><g data-node="Local visual review and coverage receipt"><rect x="490" y="440" width="440" height="108" rx="16" fill="#fff8e9" stroke="#eeddb5"/><text x="508" y="469" font-size="15" fill="#94631d" font-weight="600">Local visual review and coverage receipt</text><text x="508" y="494" font-size="13" fill="#52617b" font-weight="400">Review queued figures, tables, formulas and variants</text><text x="508" y="514" font-size="13" fill="#52617b" font-weight="400">Retain reviewed / partial / unavailable per item</text></g><path d="M250 548V570H480V597" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M710 548V570H480" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="Timeline, HTML and manifest"><rect x="30" y="600" width="900" height="84" rx="16" fill="#edf8f5" stroke="#cfe9df"/><text x="48" y="629" font-size="15" fill="#17765d" font-weight="600">Timeline, HTML and manifest</text><text x="48" y="654" font-size="13" fill="#52617b" font-weight="400">timeline.json · visual_review.json · timeline.deepseek.html</text><text x="48" y="674" font-size="13" fill="#52617b" font-weight="400">Validate text, visuals, claims and Canonical writes separately; retain original provenance</text></g></g></svg>