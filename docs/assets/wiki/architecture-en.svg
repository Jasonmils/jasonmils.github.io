<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">AITradingWiki system architecture</title><desc id="desc">Original evidence, derived artifacts, page approval and queryable knowledge</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8498bf"/></marker></defs><rect width="960" height="540" rx="24" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="38" font-size="20" fill="#1e293b" font-weight="600">From source evidence to auditable research knowledge</text><g data-node="Immutable source layer"><rect x="30" y="110" width="220" height="160" rx="16" fill="#f7f8fa" stroke="#e2e6ef"/><text x="48" y="139" font-size="15" fill="#475569" font-weight="600">Immutable source layer</text><text x="48" y="164" font-size="13" fill="#52617b" font-weight="400">PDF / PPTX / DOCX / XLSX</text><text x="48" y="184" font-size="13" fill="#52617b" font-weight="400">MP4</text><text x="48" y="204" font-size="13" fill="#52617b" font-weight="400">Source identity / hash /</text><text x="48" y="224" font-size="13" fill="#52617b" font-weight="400">locator</text></g><g data-node="Native document extraction"><rect x="310" y="80" width="270" height="100" rx="16" fill="#f0f4ff" stroke="#d5dff8"/><text x="328" y="109" font-size="15" fill="#1b45dc" font-weight="600">Native document extraction</text><text x="328" y="134" font-size="13" fill="#52617b" font-weight="400">Text / tables / image regions</text><text x="328" y="154" font-size="13" fill="#52617b" font-weight="400">Page / shape / block / cell</text></g><g data-node="Video evidence pipeline"><rect x="310" y="210" width="270" height="100" rx="16" fill="#f4f0fd" stroke="#e1d8f7"/><text x="328" y="239" font-size="15" fill="#7050b1" font-weight="600">Video evidence pipeline</text><text x="328" y="264" font-size="13" fill="#52617b" font-weight="400">ASR + WhisperX + OCR</text><text x="328" y="284" font-size="13" fill="#52617b" font-weight="400">Timeline / slides / review</text></g><g data-node="Evidence and page preview"><rect x="650" y="120" width="280" height="160" rx="16" fill="#fff8e9" stroke="#eeddb5"/><text x="668" y="149" font-size="15" fill="#94631d" font-weight="600">Evidence and page preview</text><text x="668" y="174" font-size="13" fill="#52617b" font-weight="400">Atomic claims / provenance /</text><text x="668" y="194" font-size="13" fill="#52617b" font-weight="400">evidence class</text><text x="668" y="214" font-size="13" fill="#52617b" font-weight="400">Coverage / drafts / dependencies</text></g><path d="M250 185H280V130H307" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M280 185V260H307" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M580 130H620V175H647" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M580 260H620V220H647" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="Canonical knowledge pages"><rect x="650" y="370" width="280" height="110" rx="16" fill="#edf8f5" stroke="#cfe9df"/><text x="668" y="399" font-size="15" fill="#17765d" font-weight="600">Canonical knowledge pages</text><text x="668" y="424" font-size="13" fill="#52617b" font-weight="400">Source / Entity / Concept</text><text x="668" y="444" font-size="13" fill="#52617b" font-weight="400">Event / Model / Synthesis</text></g><path d="M790 280V367" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="670" y="330" font-size="13" fill="#94631d" font-weight="600">Exact-page approval + verification</text><g data-node="Bounded retrieval and context delivery"><rect x="30" y="370" width="550" height="110" rx="16" fill="#f0f4ff" stroke="#d5dff8"/><text x="48" y="399" font-size="15" fill="#1b45dc" font-weight="600">Bounded retrieval and context delivery</text><text x="48" y="424" font-size="13" fill="#52617b" font-weight="400">Metadata → outline → sections → evidence package</text><text x="48" y="444" font-size="13" fill="#52617b" font-weight="400">Fixed budgets / snapshot-bound continuation / provenance</text></g><path d="M650 425H583" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="30" y="514" font-size="13" fill="#52617b" font-weight="400">Codex orchestrates Skills and Python tools; Obsidian provides links, backlinks and graph browsing</text></g></svg>