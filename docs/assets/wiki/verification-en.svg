<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Approval and post-write verification</title><desc id="desc">Named drafts, approval scope, concurrency checks and an independent receipt</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8498bf"/></marker></defs><rect width="960" height="460" rx="24" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="38" font-size="20" fill="#1e293b" font-weight="600">Checkable write scope and completion criteria</text><g data-node="1 · Drafts and baseline"><rect x="30" y="118" width="195" height="150" rx="16" fill="#f7f8fa" stroke="#e2e6ef"/><text x="48" y="147" font-size="13" fill="#475569" font-weight="600">1 · Drafts and baseline</text><text x="48" y="172" font-size="13" fill="#52617b" font-weight="400">Pages and</text><text x="48" y="192" font-size="13" fill="#52617b" font-weight="400">dependencies</text><text x="48" y="212" font-size="13" fill="#52617b" font-weight="400">Source / draft / live</text><text x="48" y="232" font-size="13" fill="#52617b" font-weight="400">hashes</text></g><g data-node="2 · Exact-page approval"><rect x="265" y="118" width="195" height="150" rx="16" fill="#fff8e9" stroke="#eeddb5"/><text x="283" y="147" font-size="13" fill="#94631d" font-weight="600">2 · Exact-page approval</text><text x="283" y="172" font-size="13" fill="#52617b" font-weight="400">Approve exact IDs and</text><text x="283" y="192" font-size="13" fill="#52617b" font-weight="400">baseline</text><text x="283" y="212" font-size="13" fill="#52617b" font-weight="400">Re-preview changed</text><text x="283" y="232" font-size="13" fill="#52617b" font-weight="400">scope</text></g><g data-node="3 · Protected writes"><rect x="500" y="118" width="195" height="150" rx="16" fill="#f0f4ff" stroke="#d5dff8"/><text x="518" y="147" font-size="13" fill="#1b45dc" font-weight="600">3 · Protected writes</text><text x="518" y="172" font-size="13" fill="#52617b" font-weight="400">Shared lock +</text><text x="518" y="192" font-size="13" fill="#52617b" font-weight="400">expected-old hash</text><text x="518" y="212" font-size="13" fill="#52617b" font-weight="400">Atomic pages / index</text><text x="518" y="232" font-size="13" fill="#52617b" font-weight="400">/ append log</text></g><g data-node="4 · Independent check"><rect x="735" y="118" width="195" height="150" rx="16" fill="#edf8f5" stroke="#cfe9df"/><text x="753" y="147" font-size="13" fill="#17765d" font-weight="600">4 · Independent check</text><text x="753" y="172" font-size="13" fill="#52617b" font-weight="400">Compare live files</text><text x="753" y="192" font-size="13" fill="#52617b" font-weight="400">and drafts</text><text x="753" y="212" font-size="13" fill="#52617b" font-weight="400">Emit post-write</text><text x="753" y="232" font-size="13" fill="#52617b" font-weight="400">receipt</text></g><path d="M225 192H262" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M460 192H497" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M695 192H732" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="Verification checks"><rect x="30" y="320" width="900" height="103" rx="16" fill="#f7f8fa" stroke="#e2e6ef"/><text x="48" y="349" font-size="15" fill="#475569" font-weight="600">Verification checks</text><text x="48" y="374" font-size="13" fill="#52617b" font-weight="400">Unchanged sources / exact approval scope / unique index entries / append-only history / no extra page edits</text><text x="48" y="394" font-size="13" fill="#52617b" font-weight="400">Conflicts and mid-run failures retain actual progress; partial evidence remains partial</text></g></g></svg>