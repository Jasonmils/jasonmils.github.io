<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc"><title id="title">视频证据处理链路</title><desc id="desc">音频转录和视觉处理分路执行，文本整理与本地视觉复核共同接受覆盖检查</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#8498bf"/></marker></defs><rect width="960" height="720" rx="24" fill="#fff"/><g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="30" y="38" font-size="20" fill="#1e293b" font-weight="600">视频 → 时间线与可定位证据</text><g data-node="MP4 预检与来源保留"><rect x="30" y="62" width="900" height="82" rx="16" fill="#f7f8fa" stroke="#e2e6ef"/><text x="48" y="91" font-size="15" fill="#475569" font-weight="600">MP4 预检与来源保留</text><text x="48" y="116" font-size="13" fill="#52617b" font-weight="400">原文件哈希、媒体信息、依赖与配置检查；生成稳定的源 / 任务身份</text></g><path d="M480 144V159H250V177" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M480 159H710V177" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="音频：转录路由与本地对齐"><rect x="30" y="180" width="440" height="190" rx="16" fill="#f0f4ff" stroke="#d5dff8"/><text x="48" y="209" font-size="15" fill="#1b45dc" font-weight="600">音频：转录路由与本地对齐</text><text x="48" y="234" font-size="13" fill="#52617b" font-weight="400">经授权的 Gemini 音频分块，或本地 Qwen3-ASR</text><text x="48" y="254" font-size="13" fill="#52617b" font-weight="400">WhisperX 生成字词时间戳；本地说话人处理</text><text x="48" y="274" font-size="13" fill="#52617b" font-weight="400">普通失败可回退；远端清理未证明则停止</text><text x="48" y="294" font-size="13" fill="#52617b" font-weight="400">记录实际提供方、对齐模型与失败原因</text></g><g data-node="视觉：PPT 与图表证据"><rect x="490" y="180" width="440" height="190" rx="16" fill="#f4f0fd" stroke="#e1d8f7"/><text x="508" y="209" font-size="15" fill="#7050b1" font-weight="600">视觉：PPT 与图表证据</text><text x="508" y="234" font-size="13" fill="#52617b" font-weight="400">关键帧与 PPT 页面身份 / 去重 / 回访</text><text x="508" y="254" font-size="13" fill="#52617b" font-weight="400">每个主关键帧执行通用 OCR</text><text x="508" y="274" font-size="13" fill="#52617b" font-weight="400">每个规范页面代表执行结构 OCR</text><text x="508" y="294" font-size="13" fill="#52617b" font-weight="400">图表 / 公式风险 → 必需截图复核队列</text></g><path d="M250 370V437" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M710 370V400H250V437" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="394" y="394" font-size="12" fill="#52617b" font-weight="400">仅转录 / OCR 文字</text><path d="M710 370V437" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="文本整理 · 经独立授权"><rect x="30" y="440" width="440" height="108" rx="16" fill="#f0f4ff" stroke="#d5dff8"/><text x="48" y="469" font-size="15" fill="#1b45dc" font-weight="600">文本整理 · 经独立授权</text><text x="48" y="494" font-size="13" fill="#52617b" font-weight="400">DeepSeek 接收转录与相关 PPT OCR 文字</text><text x="48" y="514" font-size="13" fill="#52617b" font-weight="400">保留原始 ASR / OCR 与时间定位</text></g><g data-node="本地视觉复核与覆盖回执"><rect x="490" y="440" width="440" height="108" rx="16" fill="#fff8e9" stroke="#eeddb5"/><text x="508" y="469" font-size="15" fill="#94631d" font-weight="600">本地视觉复核与覆盖回执</text><text x="508" y="494" font-size="13" fill="#52617b" font-weight="400">按截图队列核查图、表、公式及变体</text><text x="508" y="514" font-size="13" fill="#52617b" font-weight="400">逐项保留 reviewed / partial / unavailable</text></g><path d="M250 548V570H480V597" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M710 548V570H480" fill="none" stroke="#8498bf" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-node="时间线、HTML 与 Manifest"><rect x="30" y="600" width="900" height="84" rx="16" fill="#edf8f5" stroke="#cfe9df"/><text x="48" y="629" font-size="15" fill="#17765d" font-weight="600">时间线、HTML 与 Manifest</text><text x="48" y="654" font-size="13" fill="#52617b" font-weight="400">timeline.json · visual_review.json · timeline.deepseek.html</text><text x="48" y="674" font-size="13" fill="#52617b" font-weight="400">文字、视觉、论断与正式写入分别验证；派生证据保留原始来源归属</text></g></g></svg>